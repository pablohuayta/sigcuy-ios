# Compilación de SigCuy para el simulador de iOS.
#
# Codemagic ejecuta esto en Macs reales de su nube, así que no hace falta
# tener macOS ni Xcode. Las compilaciones para simulador NO se firman, por lo
# que tampoco se necesita la licencia de Apple Developer (99 USD/año).
#
# El resultado es `Runner.app` comprimido, que es exactamente lo que acepta
# Appetize.io para correr el simulador dentro del navegador.
#
# Uso:
#   1. Sube este proyecto a GitHub.
#   2. En codemagic.io conecta el repositorio.
#   3. Ejecuta el workflow "ios-simulador".
#   4. Descarga SigCuy-simulador.zip de los artefactos.
#   5. Súbelo a appetize.io y comparte el enlace.

workflows:
  ios-simulador:
    name: SigCuy · build para simulador iOS
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest
      groups:
        # Grupo de variables definido en Codemagic → Environment variables.
        # Debe contener:
        #   APPETIZE_TOKEN       token de la API de Appetize (marcar Secure)
        #   APPETIZE_PUBLIC_KEY  identificador de la app ya subida
        # Si el grupo no existe o está vacío, la publicación se salta sola.
        - appetize

    scripts:
      - name: Comprobar el entorno
        script: |
          flutter --version
          flutter doctor -v

      - name: Obtener dependencias
        script: flutter pub get

      - name: Generar la carpeta ios si no existe
        script: |
          if [ ! -d "ios" ]; then
            echo "No hay carpeta ios; generándola."
            flutter create --platforms=ios .
          fi

      - name: Compilar para el simulador
        script: flutter build ios --simulator

      - name: Empaquetar el .app
        script: |
          cd build/ios/iphonesimulator
          zip -r -y SigCuy-simulador.zip Runner.app

      - name: Publicar en Appetize
        script: |
          if [ -z "$APPETIZE_TOKEN" ]; then
            echo "Sin APPETIZE_TOKEN: me salto la publicación."
            echo "Descarga el zip de los artefactos y súbelo a mano en appetize.io."
            exit 0
          fi

          ZIP="build/ios/iphonesimulator/SigCuy-simulador.zip"

          # Si ya existe una app publicada, se actualiza en lugar de crear
          # otra: así el enlace que le pasaste al ingeniero sigue sirviendo.
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            URL="https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY"
          else
            URL="https://api.appetize.io/v1/apps"
          fi

          RESPUESTA=$(curl -sS --http1.1 "$URL" \
            -u "$APPETIZE_TOKEN:" \
            -F "file=@$ZIP" \
            -F "platform=ios")

          echo "$RESPUESTA" > appetize-respuesta.json

          if echo "$RESPUESTA" | grep -q '"publicKey"'; then
            CLAVE=$(echo "$RESPUESTA" | sed -n 's/.*"publicKey":"\([^"]*\)".*/\1/p')
            echo "✅ Publicado en Appetize."
            echo "   Enlace: https://appetize.io/app/$CLAVE"
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              echo "   Guarda $CLAVE como APPETIZE_PUBLIC_KEY para que las"
              echo "   próximas builds actualicen esta misma app y el enlace"
              echo "   que ya compartiste siga sirviendo."
            fi
          else
            echo "⚠️ Appetize devolvió algo inesperado:"
            echo "$RESPUESTA"
          fi

    artifacts:
      - build/ios/iphonesimulator/SigCuy-simulador.zip
      - appetize-respuesta.json

  ios-ipa:
    name: SigCuy · IPA sin firmar (entregable)
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Obtener dependencias
        script: flutter pub get

      - name: Compilar en modo release sin firmar
        script: flutter build ios --release --no-codesign

      - name: Empaquetar el .ipa
        # `flutter build ipa` intenta exportar el archivo firmado y falla sin
        # certificado. Un .ipa no es más que un zip con la carpeta Payload
        # dentro, así que se construye a mano y siempre funciona.
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y SigCuy-sin-firmar.ipa Payload
          ls -lh SigCuy-sin-firmar.ipa

      - name: Aviso sobre el archivo generado
        script: |
          echo "==============================================================="
          echo " SigCuy-sin-firmar.ipa es un entregable, NO un instalable."
          echo ""
          echo " Contiene la aplicación compilada para iPhone en modo release,"
          echo " pero sin la firma de Apple. Sirve como evidencia de producto"
          echo " y para inspeccionar el binario."
          echo ""
          echo " Para que se pueda instalar en un iPhone hace falta el Apple"
          echo " Developer Program (99 USD/año) y distribuirlo por TestFlight."
          echo "==============================================================="

    artifacts:
      - build/ios/iphoneos/SigCuy-sin-firmar.ipa

  web:
    name: SigCuy · build web (PWA)
    instance_type: linux_x2
    max_build_duration: 20

    environment:
      flutter: stable

    scripts:
      - name: Obtener dependencias
        script: flutter pub get

      - name: Compilar la web
        script: flutter build web --release

      - name: Empaquetar
        script: |
          cd build/web
          zip -r -y ../../SigCuy-web.zip .

    artifacts:
      - SigCuy-web.zip
